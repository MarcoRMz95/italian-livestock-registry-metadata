[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "italian-livestock-registry-metadata"
version = "1.0.0"
description = "Retrieve public animal metadata from Italy's VetInfo BDN registry."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["italy", "livestock", "metadata", "vetinfo", "bdn"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "playwright>=1.45,<2",
]

[project.scripts]
italian-livestock-metadata = "italian_livestock_metadata:main"

[project.urls]
Homepage = "https://github.com/MarcoRMz95/italian-livestock-registry-metadata"
Issues = "https://github.com/MarcoRMz95/italian-livestock-registry-metadata/issues"
Data = "https://www.vetinfo.it/sso_portale/informazioni/int_capi_no_log.pl?P_CAPI=BOV"

[tool.setuptools]
py-modules = ["italian_livestock_metadata"]
